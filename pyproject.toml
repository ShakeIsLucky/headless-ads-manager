[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "headless-ads-manager"
version = "0.1.0"
description = "Drive Meta Ads from code, not the Ads Manager UI — read-safe by default, two-gate write protection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shake" }]
keywords = ["meta", "facebook", "ads", "marketing-api", "advertising", "automation", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/ShakeIsLucky/headless-ads-manager"

[project.scripts]
headless-ads-demo = "headless_ads.demo:main"

[tool.setuptools]
packages = ["headless_ads"]
